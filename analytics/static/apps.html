<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>App 使用与下载 · 星途日历·火箭云</title><link rel="stylesheet" href="./style.css"><body><header><h1>App 使用与下载</h1><a href="./">返回访问统计</a></header><main><section class="controls"><label>开始日期<input id="start" type="date"></label><label>结束日期<input id="end" type="date"></label><button id="refresh">刷新</button></section><p id="state" role="status"></p><div class="metrics" id="metrics"></div><section class="panel"><h2>平台与版本</h2><div class="table-wrap"><table><thead><tr><th>平台</th><th>版本 / 构建</th><th>会话</th><th>前台时长</th><th>最近心跳</th></tr></thead><tbody id="apps"></tbody></table></div></section><section class="panel"><h2>每日使用</h2><div id="daily"></div></section><section class="panel"><h2>安卓下载入口请求</h2><div id="downloads"></div></section><section class="panel"><h2>统计说明</h2><p>会话为 App 内临时随机编号，不是人数或安装量。心跳每30秒在前台发送，后台暂停；断网、关闭统计会漏报。最近90秒有前台心跳视为活跃。</p><p>下载次数是本站下载入口 GET 请求数，排除已识别机器人和 HEAD；不代表完成下载或安装，GitHub及直接文件链接不计入。仅保存日期汇总。App统计不保存IP、设备标识、经纬度或报告内容，保存90天；App页脚可关闭使用统计。</p></section></main><script src="./apps.js"></script></body></html>
