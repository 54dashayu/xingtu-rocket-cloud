  <div class="article" id="dochtmlcon" style="display:none"> <div class=TRS_Editor><div>北京时间2026年5月24日23时08分，搭载神舟二十三号载人飞船的长征二号F遥二十三运载火箭在酒泉卫星发射中心点火发射，约10分钟后，飞船与火箭成功分离，进入预定轨道，航天员乘组状态良好，发射取得圆满成功。</div></div></div>
